  <script>
    (function () {
      function applyParams (params) {
        window._pandauiParams = params
        if (typeof window.onPandaUIParams === 'function') window.onPandaUIParams(params)
      }

      window.addEventListener('message', function (event) {
        var data = event.data
        if (!data) return
        if (data.type === 'pandaui-params') applyParams(data.params)
        else if (data.type === 'pandaui-fn' && data.name && data.code) {
          try {
            var fn = (new Function('return (' + data.code + ')'))()
            window[data.name] = fn
            window._pandauiFunctions = window._pandauiFunctions || {}
            window._pandauiFunctions[data.name] = true
            if (typeof window.onPandaUIFunctionRegistered === 'function') window.onPandaUIFunctionRegistered(data.name, fn)
          } catch (error) {
            console.error('Failed to reconstruct function', error)
          }
        }
      })

      window.applyPandaUIParams = applyParams
    })()
  </script>
